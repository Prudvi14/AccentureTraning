# =========================
# DEPLOY DEV
# =========================
- stage: deploy_dev
  displayName: ApplicationDeplo
  jobs:
  - job: dev
    steps:
    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: current
        downloadType: single
        artifactName: drop
        downloadPath: $(System.DefaultWorkingDirectory)

    - task: AzureRmWebAppDeployment@4
      inputs:
        ConnectionType: AzureRM
        azureSubscription: '$(connectedservicename)'
        appType: webApp
        WebAppName: '$(app_name)'
        packageForLinux: $(System.DefaultWorkingDirectory)/drop/*.zip


# =========================
# FUNCTIONAL TEST DEV
# =========================
- stage: functionaltest_dev
  displayName: FunctionalTest
  jobs:
  - job: FunctionalTesting
    steps:
    - task: CmdLine@2
      inputs:
        script: echo "function testing"


# =========================
# DEPLOY STAGING
# =========================
- stage: deploy_staging
  displayName: staging
  jobs:
  - job: staging
    condition: and(succeeded(), eq(variables['deploy_staging'], 'yes'))
    steps:
    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: current
        downloadType: single
        artifactName: drop
        downloadPath: $(System.DefaultWorkingDirectory)

    - task: AzureRmWebAppDeployment@4
      inputs:
        ConnectionType: AzureRM
        azureSubscription: '$(connectedservicename)'
        appType: webApp
        WebAppName: $(staging_app)
        packageForLinux: $(System.DefaultWorkingDirectory)/drop/*.zip


# =========================
# FUNCTIONAL TEST STAGING
# =========================
- stage: functionaltest_staging
  displayName: FunctionalTestStaging
  jobs:
  - job: FunctionalTesting
    steps:
    - task: CmdLine@2
      inputs:
        script: echo "function testing"


# =========================
# DEPLOY PRODUCTION
# =========================
- stage: deploy_prod
  displayName: DeployToProd
  jobs:
  - job: prod
    condition: and(succeeded(), eq(variables['deploy_prod'], 'yes'))
    steps:
    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: current
        downloadType: single
        artifactName: drop
        downloadPath: $(System.DefaultWorkingDirectory)

    - task: AzureRmWebAppDeployment@4
      inputs:
        ConnectionType: AzureRM
        azureSubscription: '$(connectedservicename)'
        appType: webApp
        WebAppName: $(prod_app)
        packageForLinux: $(System.DefaultWorkingDirectory)/drop/*.zip


# =========================
# FUNCTIONAL TEST PRODUCTION
# =========================
- stage: functionaltest_prod
  displayName: FunctionalTestingProd
  jobs:
  - job: FunctionalTesting
    steps:
    - task: CmdLine@2
      inputs:
        script: echo "function testing"